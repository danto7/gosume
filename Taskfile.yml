# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  BIN_NAME:
    sh: basename $(pwd)
  GOOS:
    sh: go env GOOS
  GOARCH:
    sh: go env GOARCH
  GOHOST: "GOOS={{.GOOS}} GOARCH={{.GOARCH}} go"
  CGO: "CGO_ENABLED=0"
  LDFLAGS: |
    -s -w

tasks:
  build:
    desc: Build the binary for the current OS/ARCH and move it to $PWD/bin
    deps: [clean, test]
    cmds:
      - "{{.CGO}} {{.GOHOST}} build -a -ldflags '{{.LDFLAGS}}' -o {{.BIN_NAME}}_{{.GOOS}}_{{.GOARCH}} cmd/gosume/main.go"
      - mkdir -p bin
      - mv {{.BIN_NAME}}_{{.GOOS}}_{{.GOARCH}} bin/

  # https://git-cliff.org/
  changelog:
    desc: Generate CHANGELOG.md
    cmds:
      - git-cliff --tag {{.VERSION}} -o

  clean:
    desc: Clean temp files and folders
    cmds:
      - rm -rf ./dist/
      - rm -rf ./bin/

  clean-gosume-cache:
    desc: Clean gosume-cache.json
    cmds:
      - rm -rf $XDG_CACHE_HOME/gosume-cache.json
    preconditions:
      - sh: test -f $XDG_CACHE_HOME/gosume-cache.json
        msg: "gosume-cache.json not found. Did you set XDG_CACHE_HOME?"

  default:
    desc: "Default task"
    cmds:
      - task --list-all

  # https://github.com/direnv/direnv
  envrc:
    desc: Generate .envrc file from .envrc.sample
    cmds:
      - cp .envrc.sample .envrc
      - direnv allow

  mod:
    desc: Downloads and tidy Go modules
    cmds:
      - go mod download
      - go mod tidy

  release:
    desc: Release a new version of gosume (e.g. VERSION=v0.1.0 task release)
    deps: [build, changelog]
    cmds:
      - git add CHANGELOG.md
      - git commit -m "{{.GIT_DOCS}} update CHANGELOG.md for {{.BIN_NAME}} release {{.VERSION}}"
      - git tag {{.VERSION}} -m "Release {{.BIN_NAME}} {{.VERSION}}"
      - git push origin main {{.VERSION}}
    vars:
      GIT_DOCS: "docs(CHANGELOG):"

  test:
    desc: Run all available tests (verbose)
    cmds:
      - go test -v ./...

  update:
    desc: Update all Go modules
    cmds:
      - go get -u ./...
      - go mod tidy
